name: Dependency-Scan

on:
    push:
        branches: [feat-gitops]
        paths-ignore:
          - 'k8s/**'
          - 'docs/**'
          - '**/*.md'
    workflow_dispatch:

jobs:
  dependency-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.3
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install dependency
        run: go mod tidy
 
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
 
      - name: Run govulncheck
        run: govulncheck ./...


  scan-trivy:
    name: Scan All Dependencies (trivy)
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # ← required to upload SARIF to Security tab
      actions: read            # ← required to read workflow info
      contents: read
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            trivy-db-${{ runner.os }}-
          save-always: true
 
      - name: Run Trivy on backend (Go modules)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: backend/
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: 1             # fail the job if HIGH/CRITICAL found
          format: table
 
      - name: Run Trivy on frontend (JS files)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: frontend/
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: 1
          format: table
 
      - name: Run Trivy full repo scan (SARIF report → GitHub Security tab)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: 0             # don't fail — this is just for the report
          format: sarif
          output: trivy-results.sarif
 
      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
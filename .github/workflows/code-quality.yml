name: Code-Quality

on:
    push:
        branches: [feat-gitops]
        paths-ignore:
          - 'k8s/**'
          - 'docs/**'
          - '**/*.md'
    workflow_dispatch:


jobs:
  validate-backend-code:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
        - name: checkout code 
          uses: actions/checkout@v4

        - name: setup go 
          uses: actions/setup-go@v5
          with:
            go-version: 1.26.3
            cache: true 

        - name: Install golangci-lint from binary
          run: |
            curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.9.0

        - name: install dependencies
          run: go mod tidy

        - name: run go lint
          run: golangci-lint run ./...

  validate-frontend-code:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
        - name: checkout code 
          uses: actions/checkout@v4
          with:
            fetch-depth: 0

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 22
          
        
        - name: Install Lint Tools
          run: |
            npm install --save-dev \
              eslint \
              stylelint \
              stylelint-config-standard \
              htmlhint
        
         # 1. Lint HTML files
        - name: Lint HTML
          run: |
            echo '{"rules": 
              {
              "tagname-lowercase": true,
              "attr-lowercase": true,
              "attr-value-double-quotes": true,
              "attr-no-duplication": true,
              "doctype-first": true,
              "tag-pair": true,
              "tag-self-close": false,
              "spec-char-escape": true,
              "id-unique": true,
              "src-not-empty": true,
              "alt-require": true,
              "title-require": true,
              "head-script-disabled": false,
              "style-disabled": false,
              "inline-style-disabled": false,
              "space-tab-mixed-disabled": "space",
              "id-class-ad-disabled": false,
              "href-abs-or-rel": false,
              "attr-unsafe-chars": true,
              "doctype-html5": true
            }}' > .htmllintrc.json
            npx htmlhint "**/*.html"
            rm .htmllintrc.json

        # 2. Lint CSS files
        - name: Lint CSS
          run: |
            echo '{"rules": 
              {
                "color-no-invalid-hex":                             true,
                "unit-no-unknown":                                  true,
                "property-no-unknown":                              true,
                "declaration-block-no-duplicate-properties":        true,
                "declaration-block-no-shorthand-property-overrides":true,
                "selector-pseudo-class-no-unknown":                 true,
                "selector-pseudo-element-no-unknown":               true,
                "no-duplicate-at-import-rules":                     true,
                "no-duplicate-selectors":                           true,
                "no-empty-source":                                  true,
                "shorthand-property-no-redundant-values":           true,
                "declaration-block-single-line-max-declarations":   1,
                "max-nesting-depth":                                3,
                "selector-max-id":                                  1,
                "comment-no-empty":                                 true
              
              }}' > .stylelintrc.json
            npx stylelint "**/*.css" --config .stylelintrc.json
            rm .stylelintrc.json

        # 3. Lint JavaScript files
        - name: Lint JS
          run: |
            echo 'export default [{ 
            languageOptions: {
               globals: { window: "readonly", 
                          document: "readonly", 
                          localStorage: "readonly", 
                          fetch: "readonly", 
                          confirm: "readonly", 
                          setTimeout: "readonly", 
                          console: "readonly" }},
                rules: {
                "no-console":            "warn",
                "no-debugger":           "error",
                "no-undef":              "error",
                "no-unused-vars":        ["warn", { argsIgnorePattern: "^_" }],
                "eqeqeq":               ["error", "always"],
                "curly":                ["error", "all"],
                "no-eval":               "error",
                "no-implied-eval":       "error",
                "no-var":                "error",
                "prefer-const":          "warn",
                "no-multiple-empty-lines":["warn", { max: 2 }],
                "no-trailing-spaces":    "warn",
                "semi":                 ["error", "always"],
                "quotes":               ["warn", "double", { avoidEscape: true }],
              };' > eslint.config.js
              
            npx eslint "**/*.js" --no-config-lookup --config eslint.config.js
            rm eslint.config.js
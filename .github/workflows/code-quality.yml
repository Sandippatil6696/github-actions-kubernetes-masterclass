name: Code-Quality

on:
    push:
        branches: [feat-gitops]
        paths-ignore:
          - 'k8s/**'
          - 'docs/**'
          - '**/*.md'
    workflow_dispatch:


jobs:
  validate-backend-code:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
        - name: checkout code 
          uses: actions/checkout@v4

        - name: setup go 
          uses: actions/setup-go@v5
          with:
            go-version: 1.26.3
            cache: true 

        - name: Install golangci-lint from binary
          run: |
            curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.9.0

        - name: install dependencies
          run: go mod tidy

        - name: run go lint
          run: golangci-lint run ./...

  validate-frontend-code:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
        - name: checkout code 
          uses: actions/checkout@v4
          with:
            fetch-depth: 0

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 22
        
        - name: Install Lint Tools
          run: |
            npm install --save-dev \
              eslint \
              stylelint \
              stylelint-config-standard \
              htmlhint
        
        # Temporary Dynamic CSS Config
        - name: Create Stylelint Config
          run: |
            cat > eslint.config.js << 'EOF'
            {
              "extends": "stylelint-config-standard"
            }
            EOF

      # Temporary Dynamic HTMLHint Config
        - name: Create HTMLHint Config
          run: |
            cat > .htmlhintrc << 'EOF'
            {
              "tag-pair": true,
              "tagname-lowercase": true,
              "attr-lowercase": true,
              "attr-value-double-quotes": true,
              "doctype-first": false
            }
            EOF

        # Temporary Dynamic ESLINT Config
        - name: Create ESLint Config
          run: |
            cat <<EOF > .eslintrc.json
            {
              "env": {
                "browser": true,
                "es2021": true
              },
              "extends": ["eslint:recommended"],
              " parserOptions": {
                "ecmaVersion": "latest",
                "sourceType": "script"
              },
              "rules": {
                "no-unused-vars": "warn",
                "no-console": "off"
              }
            }
            EOF

        - name: Run ESLint
          run: |
            npx eslint . --ext .js,.jsx,.ts,.tsx

        - name: Run Stylelint
          run: |
            npx stylelint "**/*.{css,scss}"

        - name: Run HTMLHint
          run: |
            npx htmlhint "**/*.html"

        - name: Cleanup Temporary Configs
          if: always()
          run: |
            rm -f .eslint.config.js
            rm -f .stylelintrc.json
            rm -f .htmlhintrc

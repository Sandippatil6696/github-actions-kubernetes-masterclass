name: Build and push

on:
  workflow_call:
    outputs:
      sha_short:
        description: "Short SHA used as image tag"
        value: ${{ jobs.build-and-push.outputs.sha_short }}
   
    
permissions:
  contents: write


jobs:
    build-and-push:
        runs-on: ubuntu-latest
        outputs:
            sha_short: ${{ steps.tag.outputs.sha_short }}
        strategy:
          matrix:
            include:
              - image: skillpulse-backend
                context: ./backend
                dockerfile: ./backend/Dockerfile

              - image: skillpulse-frontend
                context: .
                dockerfile: ./frontend/Dockerfile    

        steps:
            - name: checkout code
              uses: actions/checkout@v4
              
            - name: login to docker hub 
              uses: docker/login-action@v3
              with:
                username: ${{ vars.DOCKERHUB_USER }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: shorten image tag
              id: tag
              run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: build and push 
              uses: docker/build-push-action@v6
              with:
                context: ${{ matrix.context }}
                file: ${{ matrix.dockerfile }}
                push: true
                tags: |
                       ${{ vars.DOCKERHUB_USER }}/${{ matrix.image }}:latest 
                       ${{ vars.DOCKERHUB_USER }}/${{ matrix.image }}:${{ steps.tag.outputs.sha_short }}
                cache-from: type=gha,scope=${{ matrix.image }}
                cache-to: type=gha,mode=max,scope=${{ matrix.image }}

           
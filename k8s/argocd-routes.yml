---
# Route HTTPS traffic to ArgoCD
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-route
  namespace: argocd
spec:
  hostnames:
    - argocd.50.112.40.150.nip.io
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: skillpulse-gateway
      namespace: skillpulse
      sectionName: argocd-https
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: skillpulse-gateway
      namespace: skillpulse
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: argocd-server
          namespace: argocd
          port: 80                # only works if argocd-server runs in --insecure mode
          weight: 1
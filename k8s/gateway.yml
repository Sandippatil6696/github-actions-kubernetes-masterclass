# Requires: Gateway API CRDs + Envoy Gateway installed on the cluster
# On EKS, Envoy Gateway creates an AWS NLB for external access automatically.
# Install steps documented in terraform/README.md
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy-gateway
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: skillpulse-gateway
  namespace: skillpulse
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  gatewayClassName: envoy-gateway
  listeners:
    # HTTP — needed for cert-manager ACME HTTP-01 challenge validation.
    # cert-manager creates a temporary HTTPRoute in its own namespace to serve
    # the challenge, so allowedRoutes must permit all namespaces.
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    # HTTPS — TLS terminated at Envoy Gateway using cert-manager certificate
    - name: https
      protocol: HTTPS
      port: 443
      hostname: 52.33.255.7.nip.io
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: skillpulse-tls
      allowedRoutes:
        namespaces:
          from: Same
          
    - name: grafana-https
      protocol: HTTPS
      port: 443
      hostname: grafana.52.33.255.7.nip.io
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: grafana-tls
      allowedRoutes:
        namespaces:
          from: All

    - name: argocd-https
      protocol: HTTPS
      port: 443
      hostname: argocd.52.33.255.7.nip.io
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: argocd-tls
      allowedRoutes:
        namespaces:
          from: All
    
